document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

le=\"position:absolute;left:0;right:0;bottom:0;height:440px;background:linear-gradient(to top,rgba(31,46,34,.92),rgba(31,46,34,.55) 45%,rgba(31,46,34,0))\"><\u002Fdiv>\n\n<div style=\"position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:26px 72px;box-sizing:border-box\">\n<div style=\"background: #F4E6D8; padding: 10px 14px; display: inline-flex; overflow: visible\"><img src=\"8c34bcb9-664a-4207-9265-f096c6baa502\" alt=\"SPAARSH\" style=\"height:54px;width:auto;display:block\"><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:38px\">\n<span style=\"font:400 14px/1 'Work Sans',sans-serif;letter-spacing:.06em;color:#F4E6D8\">About<\u002Fspan>\n<span style=\"font:400 14px/1 'Work Sans',sans-serif;letter-spacing:.06em;color:#F4E6D8\">Our Work<\u002Fspan>\n<span style=\"font:400 14px/1 'Work Sans',sans-serif;letter-spacing:.06em;color:#F4E6D8\">Team<\u002Fspan>\n<span style=\"font:400 14px/1 'Work Sans',sans-serif;letter-spacing:.06em;color:#F4E6D8\">Contact<\u002Fspan>\n<span style=\"font:500 13px/1 'Work Sans',sans-serif;letter-spacing:.08em;color:#fff;background:#8F4E33;padding:14px 26px\">SUPPORT US<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"position:absolute;left:72px;bottom:96px;max-width:760px;display:flex;flex-direction:column;gap:22px\">\n<h1 style=\"margin:0;font:600 88px/0.95 'Lora',Georgia,serif;letter-spacing:.02em;color:#F4E6D8\">SPAARSH<\u002Fh1>\n<p style=\"margin:0;font:italic 400 30px/1.3 'Lora',Georgia,serif;color:#F4E6D8\">Touching Lives, Building Futures<\u002Fp>\n<p style=\"margin:0;max-width:560px;font:300 17px/1.7 'Work Sans',sans-serif;color:#F4E6D8\">A volunteer-led relief and rehabilitation effort from Sivasagar, Assam, rebuilding what the floodwaters took. <span style=\"opacity:.6;font-size:12px\">[placeholder]<\u002Fspan><\u002Fp>\n<div style=\"display:flex;gap:16px;margin-top:8px\">\n<span style=\"font:500 13px/1 'Work Sans',sans-serif;letter-spacing:.09em;color:#fff;background:#8F4E33;padding:17px 34px\">SUPPORT US<\u002Fspan>\n<span style=\"font:500 13px/1 'Work Sans',sans-serif;letter-spacing:.09em;color:#F4E6D8;border:1px solid #F4E6D8;padding:16px 33px\">OUR STORY<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:64px 72px;text-align:center;border-bottom:1px solid rgba(113,128,90,.35)\">\n<p style=\"margin:0 auto;max-width:900px;font:400 14px/1.9 'Work Sans',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#3F5D45\">SPAARSH — Strategic Platform for All-Inclusive Aid, Resilience and Sustainable Humanitarianism<\u002Fp>\n<p style=\"margin:18px 0 0;font:italic 400 15px/1.5 'Lora',Georgia,serif;color:#9C5333\">From the Sanskrit for “touch”.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:start;padding:110px 72px\">\n<div>\n<h2 style=\"margin:0 0 32px;font:600 52px/1.12 'Lora',Georgia,serif;color:#9C5333;max-width:10em;text-wrap:pretty\">Born in the waters of the Assam floods<\u002Fh2>\n<p style=\"margin:0 0 22px;font:300 17px/1.8 'Work Sans',sans-serif;color:#3F5D45\">In the monsoon of 2026, the Brahmaputra and its tributaries broke their banks across upper Assam. What began as a handful of neighbours with a borrowed boat became a coordinated network moving people, food and medicine between submerged villages in Sivasagar district.<\u002Fp>\n<p style=\"margin:0 0 22px;font:300 17px/1.8 'Work Sans',sans-serif;color:#3F5D45\">When the water receded, the harder work began. Families returned to collapsed walls, ruined seed stock and no paperwork. SPAARSH was formed so that the response would not end with the rescue boats.<\u002Fp>\n<div style=\"margin:44px 0 22px;max-width:26em\">\n<div style=\"width:72px;height:2px;background:#B96F52;margin-bottom:22px\"><\u002Fdiv>\n<p style=\"margin:0;font:italic 400 26px/1.45 'Lora',Georgia,serif;color:#3F5D45\">“Relief is a week. Rebuilding a home is a year. We stay for the year.”<\u002Fp>\n<\u002Fdiv>\n<p style=\"margin:0;font:300 17px/1.8 'Work Sans',sans-serif;color:#3F5D45\">Today the organisation works with village committees to identify the households least able to recover on their own. <span style=\"opacity:.55;font-size:12px\">[placeholder]<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#71805A;border:1px solid #F4E6D8;aspect-ratio:4/5;display:flex;align-items:center;justify-content:center\"><span style=\"font:500 12px/1.5 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:#F4E6D8;text-align:center;padding:16px\">[ORIGIN — VOLUNTEERS<br>LOADING A BOAT · 4:5]<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:0 72px 110px\">\n<p style=\"margin:0 0 40px;font:500 12px/1 'Work Sans',sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#9C5333\">What we do<\u002Fp>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:32px\">\n<div style=\"background:#E7C7A8;padding:52px 48px\">\n<div style=\"width:56px;height:56px;border:1.5px solid #B96F52;display:flex;align-items:center;justify-content:center;margin-bottom:32px\"><span style=\"font:500 8px/1 ui-monospace,Menlo,monospace;color:#9C5333\">[icon]<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin:0 0 18px;font:600 30px/1.2 'Lora',Georgia,serif;color:#3F5D45\">Immediate Humanitarian Response<\u002Fh3>\n<p style=\"margin:0;font:300 16px/1.75 'Work Sans',sans-serif;color:#3F5D45\">Boat-based evacuation, dry ration kits, drinking water and basic medicines within the first seventy-two hours, coordinated with the district administration. <span style=\"opacity:.55;font-size:12px\">[placeholder]<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#E7C7A8;padding:52px 48px\">\n<div style=\"width:56px;height:56px;border:1.5px solid #B96F52;display:flex;align-items:center;justify-content:center;margin-bottom:32px\"><span style=\"font:500 8px/1 ui-monospace,Menlo,monospace;color:#9C5333\">[icon]<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin:0 0 18px;font:600 30px/1.2 'Lora',Georgia,serif;color:#3F5D45\">Long-Term Rehabilitation<\u002Fh3>\n<p style=\"margin:0;font:300 16px/1.75 'Work Sans',sans-serif;color:#3F5D45\">Rebuilding houses on raised plinths, replacing seed and livestock, restoring documents and school access for children who lost a year. <span style=\"opacity:.55;font-size:12px\">[placeholder]<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"position:relative;margin-top:90px\">\n<div style=\"position:absolute;left:0;right:0;top:-90px;height:90px;background:#3F5D45;border-radius:50% 50% 0 0/100% 100% 0 0\"><\u002Fdiv>\n<div style=\"background:#3F5D45;padding:40px 72px 110px\">\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:48px;text-align:center\">\n<div><p style=\"margin:0;font:600 96px/1 'Lora',Georgia,serif;color:#F4E6D8\">[00]<\u002Fp><p style=\"margin:16px 0 0;font:400 12px/1.4 'Work Sans',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#F4E6D8\">People reached<\u002Fp><\u002Fdiv>\n<div><p style=\"margin:0;font:600 96px/1 'Lora',Georgia,serif;color:#F4E6D8\">[00]<\u002Fp><p style=\"margin:16px 0 0;font:400 12px/1.4 'Work Sans',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#F4E6D8\">Villages served<\u002Fp><\u002Fdiv>\n<div><p style=\"margin:0;font:600 96px/1 'Lora',Georgia,serif;color:#F4E6D8\">[00]<\u002Fp><p style=\"margin:16px 0 0;font:400 12px/1.4 'Work Sans',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#F4E6D8\">Houses rebuilt<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:100px 72px\">\n<div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:36px\">\n<h2 style=\"margin:0;font:600 42px/1.1 'Lora',Georgia,serif;color:#9C5333\">From the field<\u002Fh2>\n<span style=\"font:400 13px/1 'Work Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#3F5D45\">Sivasagar district, 2026<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px\">\n<sc-for list=\"{{ gallery }}\" as=\"tile\" hint-placeholder-count=\"8\">\n<div style=\"background:#71805A;border:1px solid #F4E6D8;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center\"><span style=\"font:500 10px/1.5 ui-monospace,Menlo,monospace;letter-spacing:.08em;color:#F4E6D8;text-align:center;padding:10px\">{{ tile.label }}<\u002Fspan><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:grid;grid-template-columns:1fr 1px 1fr;gap:64px;padding:20px 72px 110px\">\n<div>\n<p style=\"margin:0 0 22px;font:500 12px/1 'Work Sans',sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#9C5333\">Vision<\u002Fp>\n<p style=\"margin:0;font:400 27px/1.5 'Lora',Georgia,serif;color:#3F5D45\">An Assam where a flood displaces no family permanently — where every household has the means, the record and the roof to return to.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#B96F52\"><\u002Fdiv>\n<div>\n<p style=\"margin:0 0 22px;font:500 12px/1 'Work Sans',sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#9C5333\">Mission<\u002Fp>\n<p style=\"margin:0;font:400 27px/1.5 'Lora',Georgia,serif;color:#3F5D45\">To respond fast, stay long, and account for every rupee — working through village committees so decisions sit with the people affected.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:0 72px 110px\">\n<h2 style=\"margin:0 0 40px;font:600 42px/1.1 'Lora',Georgia,serif;color:#9C5333\">Our team<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:28px\">\n<sc-for list=\"{{ team }}\" as=\"m\" hint-placeholder-count=\"4\">\n<div>\n<div style=\"background:#3F5D45;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center\"><span style=\"font:600 44px/1 'Lora',Georgia,serif;letter-spacing:.06em;color:#F4E6D8\">{{ m.initials }}<\u002Fspan><\u002Fdiv>\n<p style=\"margin:20px 0 4px;font:600 20px/1.3 'Lora',Georgia,serif;color:#3F5D45\">{{ m.name }}<\u002Fp>\n<p style=\"margin:0 0 10px;font:400 12px/1 'Work Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#9C5333\">{{ m.role }}<\u002Fp>\n<p style=\"margin:0;font:300 14px/1.7 'Work Sans',sans-serif;color:#3F5D45\">{{ m.line }}<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<p style=\"margin:22px 0 0;font:300 12px/1 'Work Sans',sans-serif;color:rgba(63,93,69,.55)\">[placeholder] — names, roles and portraits to be supplied<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"position:relative;margin-top:90px\">\n<div style=\"position:absolute;left:0;right:0;top:-90px;height:90px;background:#3F5D45;border-radius:50% 50% 0 0/100% 100% 0 0\"><\u002Fdiv>\n<div style=\"background:#3F5D45;padding:30px 72px 110px\">\n<h2 style=\"margin:0 0 14px;font:600 46px/1.1 'Lora',Georgia,serif;color:#F4E6D8\">Support us<\u002Fh2>\n<p style=\"margin:0 0 48px;max-width:46em;font:300 17px/1.75 'Work Sans',sans-serif;color:#F4E6D8\">Three ways to help, in order of what families ask for most. <span style=\"opacity:.6;font-size:12px\">[placeholder]<\u002Fspan><\u002Fp>\n<div style=\"display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:28px;align-items:start\">\n<div style=\"background:#F4E6D8;padding:52px 46px\">\n<div style=\"width:60px;height:60px;border:1.5px solid #B96F52;display:flex;align-items:center;justify-content:center;margin-bottom:30px\"><span style=\"font:500 8px/1 ui-monospace,Menlo,monospace;color:#9C5333\">[icon]<\u002Fspan><\u002Fdiv>\n<p style=\"margin:0 0 14px;font:400 11px/1 'Work Sans',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#9C5333\">Flagship programme<\u002Fp>\n<h3 style=\"margin:0 0 18px;font:600 38px/1.12 'Lora',Georgia,serif;color:#3F5D45\">Build a House<\u002Fh3>\n<p style=\"margin:0 0 34px;font:300 16px/1.75 'Work Sans',sans-serif;color:#3F5D45\">Fund one raised-plinth home for a family that lost theirs. Costed, documented and handed over with the village committee.<\u002Fp>\n<span style=\"display:inline-block;font:500 13px/1 'Work Sans',sans-serif;letter-spacing:.09em;color:#fff;background:#8F4E33;padding:17px 32px\">SPONSOR A HOME<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background:#F4E6D8;padding:44px 36px\">\n<div style=\"width:52px;height:52px;border:1.5px solid #B96F52;display:flex;align-items:center;justify-content:center;margin-bottom:26px\"><span style=\"font:500 8px/1 ui-monospace,Menlo,monospace;color:#9C5333\">[icon]<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin:0 0 14px;font:600 25px/1.2 'Lora',Georgia,serif;color:#3F5D45\">Donate Raw Materials<\u002Fh3>\n<p style=\"margin:0 0 28px;font:300 15px/1.7 'Work Sans',sans-serif;color:#3F5D45\">Cement, tin sheets, bamboo and timber, delivered to our Sivasagar store.<\u002Fp>\n<span style=\"display:inline-block;font:500 12px/1 'Work Sans',sans-serif;letter-spacing:.09em;color:#fff;background:#8F4E33;padding:15px 26px\">SEE THE LIST<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background:#F4E6D8;padding:44px 36px\">\n<div style=\"width:52px;height:52px;border:1.5px solid #B96F52;display:flex;align-items:center;justify-content:center;margin-bottom:26px\"><span style=\"font:500 8px/1 ui-monospace,Menlo,monospace;color:#9C5333\">[icon]<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin:0 0 14px;font:600 25px/1.2 'Lora',Georgia,serif;color:#3F5D45\">Money or Household Items<\u002Fh3>\n<p style=\"margin:0 0 28px;font:300 15px/1.7 'Work Sans',sans-serif;color:#3F5D45\">Utensils, bedding, school kits — or a direct transfer to the relief fund.<\u002Fp>\n<span style=\"display:inline-block;font:500 12px/1 'Work Sans',sans-serif;letter-spacing:.09em;color:#fff;background:#8F4E33;padding:15px 26px\">DONATE NOW<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:grid;grid-template-columns:1fr 1.15fr;gap:80px;padding:110px 72px\">\n<div>\n<h2 style=\"margin:0 0 28px;font:600 42px/1.1 'Lora',Georgia,serif;color:#9C5333\">Get in touch<\u002Fh2>\n<p style=\"margin:0 0 36px;max-width:26em;font:300 16px/1.8 'Work Sans',sans-serif;color:#3F5D45\">For partnerships, media or volunteering in Sivasagar district.<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:20px;font:300 16px/1.6 'Work Sans',sans-serif;color:#3F5D45\">\n<div><span style=\"display:block;font:500 11px/1 'Work Sans',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#9C5333;margin-bottom:6px\">Office<\u002Fspan>Ward [00], Sivasagar<br>Assam 785640, India<\u002Fdiv>\n<div><span style=\"display:block;font:500 11px/1 'Work Sans',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#9C5333;margin-bottom:6px\">Email<\u002Fspan>contact@spaarsh.org <span style=\"opacity:.55;font-size:12px\">[placeholder]<\u002Fspan><\u002Fdiv>\n<div><span style=\"display:block;font:500 11px/1 'Work Sans',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#9C5333;margin-bottom:6px\">Phone<\u002Fspan>+91 [00000 00000]<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:12px;margin-top:36px\">\n<div style=\"width:42px;height:42px;border:1.5px solid #B96F52;display:flex;align-items:center;justify-content:center\"><span style=\"font:500 7px/1 ui-monospace,Menlo,monospace;color:#9C5333\">[fb]<\u002Fspan><\u002Fdiv>\n<div style=\"width:42px;height:42px;border:1.5px solid #B96F52;display:flex;align-items:center;justify-content:center\"><span style=\"font:500 7px/1 ui-monospace,Menlo,monospace;color:#9C5333\">[ig]<\u002Fspan><\u002Fdiv>\n<div style=\"width:42px;height:42px;border:1.5px solid #B96F52;display:flex;align-items:center;justify-content:center\"><span style=\"font:500 7px/1 ui-monospace,Menlo,monospace;color:#9C5333\">[x]<\u002Fspan><\u002Fdiv>\n<div style=\"width:42px;height:42px;border:1.5px solid #B96F52;display:flex;align-items:center;justify-content:center\"><span style=\"font:500 7px/1 ui-monospace,Menlo,monospace;color:#9C5333\">[yt]<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#E7C7A8;padding:48px 46px\">\n<div style=\"display:flex;flex-direction:column;gap:26px\">\n<div><la "margin:16px 0 0;font:italic 400 17px/1.5 'Lora',Georgia,serif;color:#F4E6D8\">Touching Lives, Building Futures<\u002Fp>\n<div style=\"display:flex;gap:10px;margin-top:28px\">\n<div style=\"width:36px;height:36px;border:1px solid #F4E6D8;display:flex;align-items:center;justify-content:center\"><span style=\"font:500 7px/1 ui-monospace,Menlo,monospace;color:#F4E6D8\">[fb]<\u002Fspan><\u002Fdiv>\n<div style=\"width:36px;height:36px;border:1px solid #F4E6D8;display:flex;align-items:center;justify-content:center\"><span style=\"font:500 7px/1 ui-monospace,Menlo,monospace;color:#F4E6D8\">[ig]<\u002Fspan><\u002Fdiv>\n<div style=\"width:36px;height:36px;border:1px solid #F4E6D8;display:flex;align-items:center;justify-content:center\"><span style=\"font:500 7px/1 ui-monospace,Menlo,monospace;color:#F4E6D8\">[x]<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<p style=\"margin:0 0 18px;font:500 11px/1 'Work Sans',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#F4E6D8;opacity:.8\">Quick links<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:12px;font:300 15px/1.4 'Work Sans',sans-serif;color:#F4E6D8\"><span>About<\u002Fspan><span>Our Work<\u002Fspan><span>Team<\u002Fspan><span>Support Us<\u002Fspan><span>Contact<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div>\n<p style=\"margin:0 0 18px;font:500 11px/1 'Work Sans',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#F4E6D8;opacity:.8\">Contact<\u002Fp>\n<div style=\"font:300 15px/1.8 'Work Sans',sans-serif;color:#F4E6D8\">Ward [00], Sivasagar<br>Assam 785640<br>contact@spaarsh.org<br>+91 [00000 00000]<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-top:1px solid rgba(244,230,216,.25);padding-top:24px;display:flex;justify-content:space-between;gap:24px;font:300 12px/1.6 'Work Sans',sans-serif;color:#F4E6D8;opacity:.85\">\n<span>Registered under the Societies Registration Act · Reg. no. [00000] · PAN [AAAAA0000A]<\u002Fspan>\n<span>© 2026 SPAARSH · Developed by Ankita Bhagawati<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<div class=\"dv-opt\" id=\"1b\"><div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#1b\">1b<\u002Fa>Mobile · 390px · header solid, form before contact details<\u002Fdiv>\n<sc-if value=\"{{ showMobile }}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"dv-card\" style=\"width:390px\">\n<div style=\"background:#F4E6D8\">\n\n<div style=\"position:relative;height:560px;overflow:hidden;background:#71805A\">\n<div style=\"position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding:88px 18px 0;border:1px solid #F4E6D8;box-sizing:border-box\"><span style=\"font:500 11px/1.5 ui-monospace,Menlo,monospace;letter-spacing:.08em;color:#F4E6D8;text-align:center;padding:12px\">[HERO — FLOOD<br>RESCUE PHOTO]<\u002Fspan><\u002Fdiv>\n<div style=\"position:absolute;left:0;right:0;bottom:0;height:380px;background:linear-gradient(to top,rgba(31,46,34,.94),rgba(31,46,34,.6) 45%,rgba(31,46,34,0))\"><\u002Fdiv>\n<div style=\"position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#3F5D45;box-sizing:border-box\">\n<div style=\"background:#F4E6D8;padding:7px 10px;display:inline-flex\"><img src=\"12d056b2-8400-481e-9b23-6e3fafc981e0\" alt=\"SPAARSH\" style=\"height:30px;width:auto;display:block\"><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:5px;padding:12px 6px\"><div style=\"width:22px;height:1.5px;background:#F4E6D8\"><\u002Fdiv><div style=\"width:22px;height:1.5px;background:#F4E6D8\"><\u002Fdiv><div style=\"width:22px;height:1.5px;background:#F4E6D8\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position:absolute;left:22px;right:22px;bottom:40px;display:flex;flex-direction:column;gap:14px\">\n<h1 style=\"margin:0;font:600 46px/0.98 'Lora',Georgia,serif;letter-spacing:.02em;color:#F4E6D8\">SPAARSH<\u002Fh1>\n<p style=\"margin:0;font:italic 400 20px/1.3 'Lora',Georgia,serif;color:#F4E6D8\">Touching Lives, Building Futures<\u002Fp>\n<p style=\"margin:0;font:300 14px/1.65 'Work Sans',sans-serif;color:#F4E6D8\">A volunteer-led relief and rehabilitation effort from Sivasagar, Assam.<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:10px;margin-top:6px\">\n<span style=\"text-align:center;font:500 12px/1 'Work Sans',sans-serif;letter-spacing:.09em;color:#fff;background:#8F4E33;padding:16px 0\">SUPPORT US<\u002Fspan>\n<span style=\"text-align:center;font:500 12px/1 'Work Sans',sans-serif;letter-spacing:.09em;color:#F4E6D8;border:1px solid #F4E6D8;padding:15px 0\">OUR STORY<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:40px 26px;text-align:center;border-bottom:1px solid rgba(113,128,90,.35)\">\n<p style=\"margin:0;font:400 12px/1.9 'Work Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#3F5D45\">SPAARSH — Strategic Platform for All-Inclusive Aid, Resilience and Sustainable Humanitarianism<\u002Fp>\n<p style=\"margin:14px 0 0;font:italic 400 14px/1.5 'Lora',Georgia,serif;color:#9C5333\">From the Sanskrit for “touch”.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"padding:54px 26px\">\n<div style=\"background:#71805A;border:1px solid #F4E6D8;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;margin-bottom:32px\"><span style=\"font:500 10px/1.5 ui-monospace,Menlo,monospace;letter-spacing:.08em;color:#F4E6D8;text-align:center;padding:12px\">[ORIGIN — VOLUNTEERS<br>LOADING A BOAT]<\u002Fspan><\u002Fdiv>\n<h2 style=\"margin:0 0 22px;font:600 34px/1.12 'Lora',Georgia,serif;color:#9C5333;text-wrap:pretty\">Born in the waters of the Assam floods<\u002Fh2>\n<p style=\"margin:0 0 18px;font:300 15px/1.8 'Work Sans',sans-serif;color:#3F5D45\">In the monsoon of 2026, the Brahmaputra and its tributaries broke their banks across upper Assam. A handful of neighbours with a borrowed boat became a network moving people, food and medicine between submerged villages.<\u002Fp>\n<p style=\"margin:0 0 18px;font:300 15px/1.8 'Work Sans',sans-serif;color:#3F5D45\">When the water receded, the harder work began. Families returned to collapsed walls and ruined seed stock. SPAARSH was formed so the response would not end with the rescue boats. <span style=\"opacity:.55;font-size:11px\">[placeholder]<\u002Fspan><\u002Fp>\n<div style=\"margin:32px 0 0\">\n<div style=\"width:56px;height:2px;background:#B96F52;margin-bottom:18px\"><\u002Fdiv>\n<p style=\"margin:0;font:italic 400 21px/1.45 'Lora',Georgia,serif;color:#3F5D45\">“Relief is a week. Rebuilding a home is a year. We stay for the year.”<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:0 26px 54px\">\n<p style=\"margin:0 0 24px;font:500 11px/1 'Work Sans',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#9C5333\">What we do<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:18px\">\n<div style=\"background:#E7C7A8;padding:34px 28px\">\n<div style=\"width:48px;height:48px;border:1.5px solid #B96F52;display:flex;align-items:center;justify-content:center;margin-bottom:22px\"><span style=\"font:500 8px/1 ui-monospace,Menlo,monospace;color:#9C5333\">[icon]<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin:0 0 12px;font:600 23px/1.2 'Lora',Georgia,serif;color:#3F5D45\">Immediate Humanitarian Response<\u002Fh3>\n<p style=\"margin:0;font:300 14px/1.75 'Work Sans',sans-serif;color:#3F5D45\">Boat-based evacuation, ration kits, drinking water and basic medicines within the first seventy-two hours.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#E7C7A8;padding:34px 28px\">\n<div style=\"width:48px;height:48px;border:1.5px solid #B96F52;display:flex;align-items:center;justify-content:center;margin-bottom:22px\"><span style=\"font:500 8px/1 ui-monospace,Menlo,monospace;color:#9C5333\">[icon]<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin:0 0 12px;font:600 23px/1.2 'Lora',Georgia,serif;color:#3F5D45\">Long-Term Rehabilitation<\u002Fh3>\n<p style=\"margin:0;font:300 14px/1.75 'Work Sans',sans-serif;color:#3F5D45\">Houses on raised plinths, replacement seed and livestock, restored documents and school access.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"position:relative;margin-top:52px\">\n<div style=\"position:absolute;left:0;right:0;top:-52px;height:52px;background:#3F5D45;border-radius:50% 50% 0 0/100% 100% 0 0\"><\u002Fdiv>\n<div style=\"background:#3F5D45;padding:16px 26px 54px;display:flex;flex-direction:column;gap:38px;text-align:center\">\n<div><p style=\"margin:0;font:600 60px/1 'Lora',Georgia,serif;color:#F4E6D8\">[00]<\u002Fp><p style=\"margin:8px 0 0;font:400 11px/1.4 'Work Sans',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#F4E6D8\">People reached<\u002Fp><\u002Fdiv>\n<div><p style=\"margin:0;font:600 60px/1 'Lora',Georgia,serif;color:#F4E6D8\">[00]<\u002Fp><p style=\"margin:8px 0 0;font:400 11px/1.4 'Work Sans',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#F4E6D8\">Villages served<\u002Fp><\u002Fdiv>\n<div><p style=\"margin:0;font:600 60px/1 'Lora',Georgia,serif;color:#F4E6D8\">[00]<\u002Fp><p style=\"margin:8px 0 0;font:400 11px/1.4 'Work Sans',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#F4E6D8\">Houses rebuilt<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:54px 26px\">\n<h2 style=\"margin:0 0 8px;font:600 30px/1.1 'Lora',Georgia,serif;color:#9C5333\">From the field<\u002Fh2>\n<p style=\"margin:0 0 22px;font:400 11px/1 'Work Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#3F5D45\">Sivasagar district, 2026<\u002Fp>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n<sc-for list=\"{{ galleryMobile }}\" as=\"tile\" hint-placeholder-count=\"4\">\n<div style=\"background:#71805A;border:1px solid #F4E6D8;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center\"><span style=\"font:500 9px/1.5 ui-monospace,Menlo,monospace;letter-spacing:.06em;color:#F4E6D8;text-align:center;padding:8px\">{{ tile.label }}<\u002Fspan><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:0 26px 54px\">\n<div>\n<p style=\"margin:0 0 14px;font:500 11px/1 'Work Sans',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#9C5333\">Vision<\u002Fp>\n<p style=\"margin:0;font:400 20px/1.5 'Lora',Georgia,serif;color:#3F5D45\">An Assam where a flood displaces no family permanently — where every household has the means, the record and the roof to return to.<\u002Fp>\n<\u002Fdiv>\n<div style=\"height:1px;background:#B96F52;margin:32px 0\"><\u002Fdiv>\n<div>\n<p style=\"margin:0 0 14px;font:500 11px/1 'Work Sans',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#9C5333\">Mission<\u002Fp>\n<p style=\"margin:0;font:400 20px/1.5 'Lora',Georgia,serif;color:#3F5D45\">To respond fast, stay long, and account for every rupee — working through village committees so decisions sit with the people affected.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:0 26px 54px\">\n<h2 style=\"margin:0 0 26px;font:600 30px/1.1 'Lora',Georgia,serif;color:#9C5333\">Our team<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px\">\n<sc-for list=\"{{ team }}\" as=\"m\" hint-placeholder-count=\"4\">\n<div>\n<div style=\"background:#3F5D45;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center\"><span style=\"font:600 30px/1 'Lora',Georgia,serif;letter-spacing:.06em;color:#F4E6D8\">{{ m.initials }}<\u002Fspan><\u002Fdiv>\n<p style=\"margin:14px 0 4px;font:600 16px/1.3 'Lora',Georgia,serif;color:#3F5D45\">{{ m.name }}<\u002Fp>\n<p style=\"margin:0 0 8px;font:400 10px/1 'Work Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#9C5333\">{{ m.role }}<\u002Fp>\n<p style=\"margin:0;font:300 13px/1.65 'Work Sans',sans-serif;color:#3F5D45\">{{ m.line }}<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"position:relative;margin-top:52px\">\n<div style=\"position:absolute;left:0;right:0;top:-52px;height:52px;background:#3F5D45;border-radius:50% 50% 0 0/100% 100% 0 0\"><\u002Fdiv>\n<div style=\"background:#3F5D45;padding:16px 26px 54px\">\n<h2 style=\"margin:0 0 10px;font:600 30px/1.1 'Lora',Georgia,serif;color:#F4E6D8\">Support us<\u002Fh2>\n<p style=\"margin:0 0 28px;font:300 14px/1.7 'Work Sans',sans-serif;color:#F4E6D8\">Three ways to help, in order of what families ask for most.<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<div style=\"background:#F4E6D8;padding:34px 26px\">\n<div style=\"width:52px;height:52px;border:1.5px solid #B96F52;display:flex;align-items:center;justify-content:center;margin-bottom:22px\"><span style=\"font:500 8px/1 ui-monospace,Menlo,monospace;color:#9C5333\">[icon]<\u002Fspan><\u002Fdiv>\n<p style=\"margin:0 0 10px;font:400 10px/1 'Work Sans',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#9C5333\">Flagship programme<\u002Fp>\n<h3 style=\"margin:0 0 12px;font:600 28px/1.12 'Lora',Georgia,serif;color:#3F5D45\">Build a House<\u002Fh3>\n<p style=\"margin:0 0 24px;font:300 14px/1.75 'Work Sans',sans-serif;color:#3F5D45\">Fund one raised-plinth home for a family that lost theirs. Costed, documented and handed over with the village committee.<\u002Fp>\n<span style=\"display:block;text-align:center;font:500 12px/1 'Work Sans',sans-serif;letter-spacing:.09em;color:#fff;background:#8F4E33;padding:16px 0\">SPONSOR A HOME<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background:#F4E6D8;padding:28px 26px\">\n<div style=\"width:44px;height:44px;border:1.5px solid #B96F52;display:flex;align-items:center;justify-content:center;margin-bottom:18px\"><span style=\"font:500 8px/1 ui-monospace,Menlo,monospace;color:#9C5333\">[icon]<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin:0 0 10px;font:600 21px/1.2 'Lora',Georgia,serif;color:#3F5D45\">Donate Raw Materials<\u002Fh3>\n<p style=\"margin:0 0 20px;font:300 14px/1.7 'Work Sans',sans-serif;color:#3F5D45\">Cement, tin sheets, bamboo and timber, delivered to our Sivasagar store.<\u002Fp>\n<span style=\"display:block;text-align:center;font:500 12px/1 'Work Sans',sans-serif;letter-spacing:.09em;color:#fff;background:#8F4E33;padding:15px 0\">SEE THE LIST<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background:#F4E6D8;padding:28px 26px\">\n<div style=\"width:44px;height:44px;border:1.5px solid #B96F52;display:flex;align-items:center;justify-content:center;margin-bottom:18px\"><span style=\"font:500 8px/1 ui-monospace,Menlo,monospace;color:#9C5333\">[icon]<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin:0 0 10px;font:600 21px/1.2 'Lora',Georgia,serif;color:#3F5D45\">Money or Household Items<\u002Fh3>\n<p style=\"margin:0 0 20px;font:300 14px/1.7 'Work Sans',sans-serif;color:#3F5D45\">Utensils, bedding, school kits — or a direct transfer to the relief fund.<\u002Fp>\n<span style=\"display:block;text-align:center;font:500 12px/1 'Work Sans',sans-serif;letter-spacing:.09em;color:#fff;background:#8F4E33;padding:15px 0\">DONATE NOW<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:54px 26px\">\n<h2 style=\"margin:0 0 22px;font:600 30px/1.1 'Lora',Georgia,serif;color:#9C5333\">Get in touch<\u002Fh2>\n<div style=\"background:#E7C7A8;padding:30px 24px;display:flex;flex-direction:column;gap:20px\">\n<div><label style=\"display:block;font:500 10px/1 'Work Sans',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#3F5D45;margin-bottom:8px\">Name<\u002Flabel><input placeholder=\"Your name\" style=\"width:100%;box-sizing:border-box;background:#F4E6D8;border:1px solid #71805A;padding:14px;font:300 15px/1 'Work Sans',sans-serif;color:#3F5D45;outline:none\"><\u002Fdiv>\n<div><label style=\"display:block;font:500 10px/1 'Work Sans',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#3F5D45;margin-bottom:8px\">Email<\u002Flabel><input placeholder=\"you@example.com\" style=\"width:100%;box-sizing:border-box;background:#F4E6D8;border:1px solid #71805A;padding:14px;font:300 15px/1 x;align-items:center;justify-content:center\"><span style=\"font:500 7px/1 ui-monospace,Menlo,monospace;color:#F4E6D8\">[fb]<\u002Fspan><\u002Fdiv>\n<div style=\"width:36px;height:36px;border:1px solid #F4E6D8;display:flex;align-items:center;justify-content:center\"><span style=\"font:500 7px/1 ui-monospace,Menlo,monospace;color:#F4E6D8\">[ig]<\u002Fspan><\u002Fdiv>\n<div style=\"width:36px;height:36px;border:1px solid #F4E6D8;display:flex;align-items:center;justify-content:center\"><span style=\"font:500 7px/1 ui-monospace,Menlo,monospace;color:#F4E6D8\">[x]<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-top:1px solid rgba(244,230,216,.25);margin-top:28px;padding-top:20px;font:300 11px/1.8 'Work Sans',sans-serif;color:#F4E6D8;opacity:.85\">\nRegistered under the Societies Registration Act · Reg. no. [00000]<br>© 2026 SPAARSH · Developed by Ankita Bhagawati\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<div class=\"dv-opt\" id=\"1c\"><div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#1c\">1c<\u002Fa>Header — scrolled state (solid deep green)<\u002Fdiv>\n<div class=\"dv-card\" style=\"width:640px\">\n<div style=\"background:#3F5D45;display:flex;align-items:center;justify-content:space-between;padding:16px 28px\">\n<div style=\"background:#F4E6D8;padding:7px 10px;display:inline-flex\"><img src=\"8c34bcb9-664a-4207-9265-f096c6baa502\" alt=\"SPAARSH\" style=\"height:32px;width:auto;display:block\"><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:22px\">\n<span style=\"font:400 12px/1 'Work Sans',sans-serif;letter-spacing:.06em;color:#F4E6D8\">About<\u002Fspan>\n<span style=\"font:400 12px/1 'Work Sans',sans-serif;letter-spacing:.06em;color:#F4E6D8\">Our Work<\u002Fspan>\n<span style=\"font:400 12px/1 'Work Sans',sans-serif;letter-spacing:.06em;color:#F4E6D8\">Team<\u002Fspan>\n<span style=\"font:400 12px/1 'Work Sans',sans-serif;letter-spacing:.06em;color:#F4E6D8\">Contact<\u002Fspan>\n<span style=\"font:500 11px/1 'Work Sans',sans-serif;letter-spacing:.08em;color:#fff;background:#8F4E33;padding:12px 20px\">SUPPORT US<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#F4E6D8;height:46px\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<p class=\"dv-next\">Try next: \"tighten the desktop hero type\" · \"give the Build a House card its own full-bleed band\" · \"show the mobile hamburger menu open\"<\u002Fp>\n<\u002Fsection>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;mockupScope&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Both&quot;,&quot;Desktop only&quot;,&quot;Mobile only&quot;],&quot;default&quot;:&quot;Both&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Mockup&quot;},&quot;galleryTiles&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:8,&quot;min&quot;:4,&quot;max&quot;:8,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Mockup&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const scope = this.props.mockupScope ?? \"Both\";\n    const labels = [\n      \"[FIELD — RATION\\nDISTRIBUTION]\", \"[FIELD — RAISED\\nPLINTH BUILD]\",\n      \"[FIELD — BOAT\\nEVACUATION]\", \"[FIELD — MEDICAL\\nCAMP]\",\n      \"[FIELD — SEED\\nHANDOVER]\", \"[FIELD — SCHOOL\\nKIT]\",\n      \"[FIELD — VILLAGE\\nCOMMITTEE]\", \"[FIELD — RECEDING\\nWATER]\"\n    ];\n    const n = Math.max(4, Math.min(8, this.props.galleryTiles ?? 8));\n    const gallery = labels.slice(0, n).map(l => ({ label: l.replace(\"\\n\", \" \") }));\n    const team = [\n      { initials: \"AB\", name: \"Name Surname\", role: \"Founder\", line: \"Coordinated boat rescue across [00] villages in 2026.\" },\n      { initials: \"RD\", name: \"Name Surname\", role: \"Relief lead\", line: \"Runs the ration and medicine supply chain.\" },\n      { initials: \"MK\", name: \"Name Surname\", role: \"Rehabilitation\", line: \"Works with village committees on housing lists.\" },\n      { initials: \"SG\", name: \"Name Surname\", role: \"Volunteers\", line: \"Onboards and rosters field volunteers.\" }\n    ];\n    return {\n      showDesktop: scope !== \"Mobile only\",\n      showMobile: scope !== \"Desktop only\",\n      gallery,\n      galleryMobile: gallery.slice(0, 4),\n      team\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
